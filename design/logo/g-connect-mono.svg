<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 方案 G「连接·极简」：两个端点 + 一根连接线，删掉所有箭头。
       语义：两端已连通（正是 easyDebug 连接成功后的状态）。
       构成：2 个圆 + 1 根线，零附属结构，左右净空各 22px 完全对称。 -->
  

  <circle cx="62" cy="128" r="26" fill="#1d4ed8"/>
  <circle cx="194" cy="128" r="26" fill="#1d4ed8"/>

  <path d="M110 128 H146" fill="none" stroke="#1d4ed8"
        stroke-width="18" stroke-linecap="round"/>
</svg>
