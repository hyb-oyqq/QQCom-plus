<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- V1「匀净」：沿用旧图标的构图（双圆 + 双向箭头 + 圆角方底），
       只动三处比例关系：
       1. 圆 r 30 -> 26，箭杆起点 86 -> 100，让出 9px 可见净空（旧版是 0px，必然接触）；
       2. 箭头从实心色块改为 14px 等宽描边，笔触变轻，视觉重心从"四块面"变成"两圆两线"；
       3. 保留旧版 180° 旋转对称（上箭右指、下箭左指），这是原图标唯一的灵动来源。 -->
  <rect width="256" height="256" rx="56" fill="#1d4ed8"/>

  <g fill="none" stroke="#ffffff" stroke-width="14">
    <path d="M100 104 H140" stroke-linecap="round"/>
    <path d="M140 90 L152 104 L140 118" stroke-linejoin="miter" stroke-linecap="butt"/>
    <path d="M116 152 H156" stroke-linecap="round"/>
    <path d="M116 136 L104 152 L116 168" stroke-linejoin="miter" stroke-linecap="butt"/>
  </g>

  <circle cx="58" cy="128" r="26" fill="#ffffff"/>
  <circle cx="198" cy="128" r="26" fill="#ffffff"/>
</svg>
