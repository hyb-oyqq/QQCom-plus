<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- V4「斜流」：圆保持严格对称与水平，仅让上下两条箭杆平行倾斜约 11°。
       打破死板的水平镜像，产生流向感；但两线严格平行、整体仍居中，
       所以不会歪。垂直跨度增到 96px，比例收到 2:1。 -->

  <g fill="none" stroke="#111827" stroke-width="14">
    <path d="M100 109 L140 101" stroke-linecap="round"/>
    <path d="M140 87 L152 101 L140 115" stroke-linejoin="miter" stroke-linecap="butt"/>
    <path d="M156 147 L116 155" stroke-linecap="round"/>
    <path d="M116 141 L104 155 L116 169" stroke-linejoin="miter" stroke-linecap="butt"/>
  </g>

  <circle cx="58" cy="128" r="26" fill="#111827"/>
  <circle cx="198" cy="128" r="26" fill="#111827"/>
</svg>
